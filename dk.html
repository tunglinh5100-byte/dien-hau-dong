<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Điều khiển điện hầu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#1d0b08;--card:#2c120d;--gold:#f2cf72;--red:#9c2a1e;--txt:#f6e9d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:16px;min-height:100vh}
h1{font-size:19px;color:var(--gold);margin:4px 0 2px}p{margin:0 0 14px;opacity:.75;font-size:13px}
button{display:block;width:100%;border:0;border-radius:16px;padding:22px 16px;margin:0 0 12px;font-size:20px;font-weight:800;color:#fff;background:#3a1a14;box-shadow:0 2px 0 rgba(0,0,0,.4)}
button:active{transform:translateY(2px)}
#xl{background:linear-gradient(#c0392b,#8e1f16);font-size:24px;padding:30px 16px;border:2px solid var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row button{margin:0}
.ong{background:#5a2d6b}.co{background:#1f8a5a}.mua{background:#7a4a14}.loc{background:#a8762a}.bo{background:#3d7fb0}.am{background:#1f5f7a;font-size:18px}.am.tat{background:#444}
h2{font-size:15px;color:var(--gold);margin:6px 0 8px}.g8 button{padding:18px 8px;font-size:17px}
#st{margin-top:12px;font-size:14px;text-align:center;min-height:20px;color:var(--gold)}
</style></head><body>
<h1>Điều khiển điện hầu</h1>
<p>Bấm nút là trang hầu đang live chuyển ngay, không cần gõ lệnh.</p>
<button id="xl" data-l="hoicung">🐉 Xe loan thánh giá</button>
<h2>Thỉnh vào thẳng giá</h2><div class="row g8"><button class="g" style="background:#a01c22" data-l="g:tamtoa">Thỉnh Tam Tòa Thánh Mẫu</button><button class="g" style="background:#2a2226" data-l="g:chualm">Thỉnh Chúa Lê Mại</button><button class="g" style="background:#2f86b8" data-l="g:chuanh">Thỉnh Chúa Nguyệt Hồ</button><button class="g" style="background:#6b5a3a" data-l="g:chuatb">Thỉnh Chúa Thác Bờ</button><button class="g" style="background:#8a7f6a" data-l="g:chuanp">Thỉnh Chúa Bà Năm Phương</button><button class="g" style="background:#c8242a" data-l="g:quannhat">Thỉnh Quan Đệ Nhất</button><button class="g" style="background:#8a7a5a" data-l="g:quantam">Thỉnh Quan Đệ Tam</button><button class="g" style="background:#1f4fb0" data-l="g:quanngu">Thỉnh Quan Đệ Ngũ</button><button class="g" style="background:#1f7a6a" data-l="g:chaudn">Thỉnh Chầu Đệ Nhị</button><button class="g" style="background:#b3202c" data-l="g:chaulu">Thỉnh Chầu Lục</button><button class="g" style="background:#3a3236" data-l="g:chaube">Thỉnh Chầu Bé</button><button class="g" style="background:#5a2d6b" data-l="g:ongbay">Thỉnh Ông Hoàng Bảy</button><button class="g" style="background:#b0841c" data-l="g:ongmuoi">Thỉnh Ông Hoàng Mười</button><button class="g" style="background:#1f8a5a" data-l="g:codoi2">Thỉnh Cô Đôi</button><button class="g" style="background:#3d7fb0" data-l="g:cobo">Thỉnh Cô Bơ</button><button class="g" style="background:#c8457f" data-l="g:cosau">Thỉnh Cô Sáu Sơn Trang</button><button class="g" style="background:#c8457f" data-l="g:cochin">Thỉnh Cô Chín</button><button class="g" style="background:#1f7a4e" data-l="g:caube">Thỉnh Cậu Bé</button></div>
<div class="row" style="margin-top:12px"><button class="mua" data-l="mua">Múa</button><button class="loc" data-l="loc">Phát lộc</button></div>
<div class="row" style="margin-top:12px"><button class="mua" data-l="ddbat">🎥 Góc máy: bật</button><button class="am tat" data-l="ddtat">🎥 Góc máy: tắt</button></div>
<button data-l="hu" style="margin-top:12px;width:100%;background:#2f6f3a;border:1px solid #e6b552;color:#fff6d6">🐒 Tiếng hú (chim kêu vượn hót)</button>
<button data-l="nhacao" style="margin-top:8px;width:100%;background:#7b3fa8;border:1px solid #e6b552;color:#fff6d6">🏮 Nhắc người xem: số lần về điện và quà mốc</button>
<div class="row" style="margin-top:8px"><button data-l="ruong" style="background:#8a5a1a;border:1px solid #e6b552;color:#fff6d6">🎁 Rương báu: quen từ 3 lần</button><button data-l="ruong10" style="background:#a0281c;border:1px solid #e6b552;color:#fff6d6">🎁 Rương báu: từ 10 lần</button></div>
<button data-l="tongket" style="margin-top:8px;width:100%;background:#b3202c;border:1px solid #e6b552;color:#fff6d6">🧧 Tổng kết: 2 bảng + nhạc kết + phát túi lộc (tự chạy khi hết giá Cậu; bấm Kết hoặc Thỉnh giá để tắt)</button>
<button id="ket" data-l="ket" style="margin-top:12px;width:100%;background:#3a1a10;border:1px solid #e6b552;color:#ffd76a">🙏 Kết thúc chương trình (bấm lần nữa để tiếp tục)</button>
<div class="row" style="margin-top:12px"><button class="am" data-l="ambat">🔊 Bật âm thanh</button><button class="am tat" data-l="amtat">🔇 Tắt âm thanh</button></div>
<div id="st"></div>
<script>
const Q = new URLSearchParams(location.search), GK = Q.get('gia'), tp = Q.get('dk') || ('dienhau-linhxo-7q4k' + (GK ? '-' + GK : '')), st = document.getElementById('st');
if (GK) { document.querySelector('h1').textContent = 'Điều khiển giá ' + ({ codoi: 'Cô Đôi', ongbay: 'Ông Hoàng Bảy' }[GK] || GK); document.querySelectorAll('[data-l="hoicung"],[data-l^="g:"],h2').forEach(b => { b.style.display = 'none'; }); }
const TEN = { hoicung: 'Xe loan thánh giá', ong: 'Thỉnh Ông Bảy', co: 'Thỉnh Cô Đôi', bo: 'Thỉnh Cô Bơ', mua: 'Múa', loc: 'Phát lộc', ambat: 'Bật âm thanh', amtat: 'Tắt âm thanh', ddbat: 'Bật góc máy tự động', ddtat: 'Tắt góc máy tự động', ket: 'Kết thúc chương trình' };
document.querySelectorAll('[data-l^="g:"]').forEach(b => { TEN[b.dataset.l] = b.textContent; });
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', async () => {
  const l = b.dataset.l; st.textContent = 'Đang gửi: ' + TEN[l] + '…'; if (navigator.vibrate) navigator.vibrate(30);
  try { const r = await fetch('https://ntfy.sh/' + tp, { method: 'POST', body: l }); st.textContent = r.ok ? '✓ Đã gửi: ' + TEN[l] + ' (' + new Date().toLocaleTimeString('vi-VN') + ')' : 'Lỗi gửi (' + r.status + '), bấm lại'; }
  catch (e) { st.textContent = 'Không gửi được, kiểm tra mạng rồi bấm lại'; } }));
</script></body></html>
