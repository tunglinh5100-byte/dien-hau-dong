function xepHang(k) { const [dx, dy] = KHU[k].diem; HANG[k].forEach((q, i) => { if (q.act && q.act.t != null) return; const tg = [dx + (i ? (i % 2 ? 6 : -6) : 0), dy + i * 42]; q.wp = q.nut === KHU[k].nut || Math.hypot(q.x - dx, q.y - dy) < 140 ? [tg] : q.wp.length ? q.wp.slice(0, -1).concat([tg]) : [tg]; q.cho = 0; }); }

const CN = { meta: null, img: {}, tint: new Map() };

let hashN = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
function mauAo(p) { const r = !p.sim && REC[p.ten]; if (r && r.ao) return r.ao; if (r && r.nv && r.nv.mix && r.nv.mix[0]) return r.nv.mix[0]; return CNM_MAU[hashN(p.ten) % CNM_MAU.length]; }

/* ---------- Người ---------- */
const NG = [];
function tao(ten, sim) { let p = NG.find(v => v.ten === ten); if (p) return p; const h = hashN(ten), [x, y] = N.cong, r = !sim && REC[ten];
  p = { ten, sim: !!sim, sx: (r && r.sx) || (h % 2 ? 'nu' : 'nam'), x: x + (Math.random() - .5) * 60, y, wp: [], nut: 'cong', act: null, ghe: null, ngoi: false, cho: 1 + Math.random() * 3, d: 4, wd: 0, bong: null, t0: Math.random() * 9 };

function rai(nut, k) { const [x, y] = N[nut]; let best = null, bd = -1; for (let n = 0; n < 6; n++) { const c = [x + (Math.random() - .5) * (k || 90), y + (Math.random() - .5) * (k ? k * .5 : 40)]; let d = 1e9; NG.forEach(q => { const tx = q.wp.length ? q.wp[q.wp.length - 1] : [q.x, q.y]; d = Math.min(d, Math.hypot(tx[0] - c[0], (tx[1] - c[1]) * 1.4)); }); if (d > bd) { bd = d; best = c; } if (d > 40) break; } return best; } /* chọn chỗ đứng xa người khác */
