<!doctype html><html lang="vi"><head><meta charset="utf-8">

<style>

#start h1 { font: 800 28px "Noto Serif", serif; margin: 0; letter-spacing: .5px; }

</style></head><body>
<div id="wrap"><canvas id="cv" width="540" height="960" aria-label="Xem giờ tốt trình ký"></canvas></div>
<div id="start">
  <h1>Xem Giờ Trình Ký</h1>
  <p class="sub">Gieo quẻ, xem giờ hoàng đạo để trình ký sếp. Nội dung giải trí, tham khảo theo lịch vạn niên.</p>
  <button id="go" type="button">▶ Mở phòng xem</button>
  <label><input id="voice" type="checkbox" checked style="width:auto"> Đọc to kết quả</label>
  <button id="tog" type="button">Cài đặt kênh</button>
  <div id="cfg" hidden>
    <input id="u" placeholder="Tên kênh TikTok, vd: @linhxo" autocomplete="off">
    <input id="k" type="password" placeholder="API key EulerStream" autocomplete="off">
    <button id="test" type="button">Kiểm tra key</button>
    <small id="res">Chỉ nhập một lần, máy tự nhớ. Không nhập thì chỉ chạy giả lập.</small>
  </div>
</div>
<script src="lich.js"></script>
<script>
(() => {
'use strict';
const L = window.LICH;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 540, H = 960, Q = new URLSearchParams(location.search);
const R = Math.min(3, Math.max(2, window.devicePixelRatio || 1)); cv.width = W * R; cv.height = H * R; ctx.setTransform(R, 0, 0, R, 0, 0);
const UI = '"Be Vietnam Pro", system-ui, sans-serif', SERIF = '"Noto Serif", Georgia, serif';

function text(s, x, y, size, c, o = {}) { ctx.font = `${o.w || 700} ${size}px ${o.f || UI}`; ctx.textAlign = o.a || 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = c; ctx.fillText(s, x, y); }

  for (const w of String(s).split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } if (line) out.push(line); return out; }
const ten = s => { s = String(s || '').trim(); return s.length > 18 ? s.slice(0, 17) + '…' : s; };

// ---------- Trạng thái ----------
const S = { nho: new Map(), nhoSep: new Map(), t: 0, day: null, queue: [], cur: null, idleT: 3, noi: null, likes: new Map(), lastXem: new Map(), coins: [], smoke: [], sparks: [], voice: true, sound: false, real: false, blinkT: 2, blink: 0, idleI: 0 };
function refreshDay() { S.day = L.homNay(); } refreshDay(); setInterval(refreshDay, 15000);
// ---------- Âm thanh (WebAudio, tự tạo, không tải file) ----------
let AC = null, master = null;
function acGet() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, vol, type, at) { const a = AC; if (!a || !S.sound) return; const t0 = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05); }
const sCoin = () => { [2637, 3520, 4186].forEach((f, i) => tone(f * rnd(.97, 1.03), .25, .05, 'sine', i * .012)); };
const sWood = () => { tone(820, .09, .18, 'triangle'); tone(410, .12, .08, 'sine'); };
const sGong = () => { [110, 165, 220, 331].forEach((f, i) => tone(f, 3.2 - i * .4, .14 / (i + 1), 'sine')); };
const PENTA = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3];
function ambient() { if (!S.sound || !AC) return; const f = pick(PENTA) * pick([1, 1, .5]); tone(f, 2.2, .045, 'triangle'); tone(f * 2.01, 1.2, .012, 'sine'); }
setInterval(() => { if (Math.random() < .6) ambient(); }, 1700);

// ---------- Giọng thầy ----------
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /^vi/i.test(v.lang) && /nam|male|an|minh/i.test(v.name)) || vs.find(v => /^vi/i.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(s, then) { if (!VOICE) pickVoice(); if (!S.voice || !('speechSynthesis' in window) || !VOICE) { /* máy không có giọng tiếng Việt thì không đọc */ if (then) setTimeout(then, 0); return 0; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s); u.lang = 'vi-VN'; if (VOICE) u.voice = VOICE; u.rate = 1.0; u.pitch = .72; u.volume = 1;
    S.speaking = true; u.onend = u.onerror = () => { S.speaking = false; if (then) then(); }; speechSynthesis.speak(u); return 1; } catch (e) { return 0; } }

// ---------- Việc của thầy: mỗi việc { ten, tuoi | null, that } ----------
function enqueue(job) { const old = S.queue.findIndex(j => j.ten === job.ten); if (old >= 0) { S.queue[old] = job; return; } if (S.cur && S.cur.job.ten === job.ten && !job.ngay) return;
  if (job.that) { const i = S.queue.findIndex(j => !j.that); if (i >= 0) S.queue.splice(i, 0, job); else S.queue.push(job); } else if (S.queue.length < 2) S.queue.push(job);
  if (S.queue.length > 10) S.queue.splice(10); }
function startJob(job) { refreshDay(); const tu = job.tuoi || S.nho.get(job.ten) || null, se = job.sep || S.nhoSep.get(job.ten) || null;
  S.cur = { job, ans: job.ngay ? L.phanNgay(job.ten, S.day, job.ngay, tu, se) : L.phan(job.ten, S.day, tu, se), phase: 'goi', t: 0, tossI: 0 }; noi('Đang xem cho ' + ten(job.ten) + '…', 99); sWood(); }
function throwCoins() { const faces = [0, 1, 2].map(() => Math.random() < .5 ? 1 : 0);
  S.coins = faces.map((f, i) => ({ x0: HX + rnd(-8, 8), y0: HY + 130, x1: HX - 46 + i * 46 + rnd(-8, 8), y1: DESK + 6 + rnd(-3, 3), t: -i * .06, dur: .62, face: f, rot: rnd(8, 14) })); setTimeout(sCoin, 560); }
function noi(s, life) { S.noi = { s, t: 0, life: life || 5 }; }
const IDLE = ['Sắp trình ký? Thả 10 tim để xem.', 'Bình luận năm sinh, xem theo tuổi.', 'Xem cho vui, tham khảo lịch vạn niên.', 'Không nhận quà, thả tim là được.', 'Ghi thêm năm sinh sếp, vd: sếp 1975.', 'Hỏi ngày khác được: "mai", "thứ 5".'];
function update(dt) {
  S.t += dt; S.blinkT -= dt; if (S.blinkT < 0) { S.blink = .14; S.blinkT = rnd(2.5, 5.5); } S.blink = Math.max(0, S.blink - dt);
  S.coins.forEach(c => c.t += dt);
  if (Math.random() < dt * 2.5) S.smoke.push({ x: 186, y: DESK - 40, t: 0, life: rnd(3, 4.5), dx: rnd(-6, 6) }); S.smoke.forEach(s => s.t += dt); S.smoke = S.smoke.filter(s => s.t < s.life);
  S.sparks.forEach(s => { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 20 * dt; }); S.sparks = S.sparks.filter(s => s.t < s.life);
  if (S.noi) { S.noi.t += dt; if (S.noi.t > S.noi.life) S.noi = null; }
  const c = S.cur;
  if (!c) { S.idleT -= dt; if (S.idleT <= 0 && S.queue.length) startJob(S.queue.shift()); else if (S.idleT < -6 && !S.noi) { S.idleT = 0; noi(IDLE[S.idleI++ % IDLE.length], 5); } return; }
  c.t += dt;
  if (c.phase === 'goi' && c.t > 1.2) { c.phase = 'gieo'; c.t = 0; throwCoins(); }
  else if (c.phase === 'gieo' && c.t > 1.15) { c.tossI++; c.t = 0; if (c.tossI >= 3) { c.phase = 'suy'; noi('Đang tính giờ…', 99); } else throwCoins(); }
  else if (c.phase === 'suy' && c.t > 2.4) { c.phase = 'phan'; c.t = 0; S.noi = null; sGong(); burst(); say(c.ans.speak, () => { c.spoke = true; }); }
  else if (c.phase === 'phan' && c.t > 10 && (c.spoke || c.t > 20)) { c.phase = 'xong'; c.t = 0; }
  else if (c.phase === 'xong' && c.t > .5) { S.cur = null; S.coins = []; S.idleT = 1.5; }
}
function burst() { for (let i = 0; i < 26; i++) { const a = rnd(0, 6.28), v = rnd(30, 110); S.sparks.push({ x: HX, y: HY - 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: rnd(1, 1.8), c: pick(['#ffe39a', '#f6c453', '#fff6d6']) }); } }

// ---------- Vẽ: nền điện, thầy, lời thầy ----------
const HX = 270, HY = 352, DESK = 528, SC = 1.3, BASE_Y = 880; // thầy vẽ ở toạ độ gốc rồi phóng SC, đặt mép bàn ở BASE_Y
let SEED = 7; const srnd = () => (SEED = (SEED * 16807) % 2147483647) / 2147483647;
function makeVine(x, y, len, dir) { const pts = [], leaves = []; let cx = x, cy = y; for (let i = 0; i < len; i++) { cx += (srnd() - .5) * 5 + dir * .6; cy += 9; pts.push([cx, cy]); if (i % 2 === 0 && i > 1) leaves.push({ i, side: (i / 2) % 2 ? 1 : -1, s: .75 + srnd() * .5, c: ['#3f8f3c', '#57a84a', '#2f7330', '#6cb85a'][Math.floor(srnd() * 4)] }); } return { pts, leaves, x, y }; }
const VINES = [makeVine(60, 168, 34, .2), makeVine(78, 170, 28, -.1), makeVine(46, 172, 22, .3), makeVine(478, 150, 36, -.2), makeVine(462, 152, 26, .1), makeVine(494, 154, 20, -.3)];
function leaf(x, y, s, a, c) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-9, -3, -10, -13, -3, -16); ctx.quadraticCurveTo(0, -14, 0, -12); ctx.quadraticCurveTo(0, -14, 3, -16); ctx.bezierCurveTo(10, -13, 9, -3, 0, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, -12); ctx.stroke(); ctx.restore(); }
function drawVine(v, t, ph) { const sw = i => Math.sin(t * .9 + ph + i * .12) * i * .18; ctx.strokeStyle = '#4a7a2e'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(v.x, v.y); v.pts.forEach((p, i) => ctx.lineTo(p[0] + sw(i), p[1])); ctx.stroke();
  v.leaves.forEach(l => { const p = v.pts[l.i]; leaf(p[0] + sw(l.i), p[1], l.s, l.side * 1.9 + Math.sin(t + l.i) * .08, l.c); }); }
function hangPot(x, y, t, ph) { const sw = Math.sin(t * .9 + ph) * 1.5; ctx.strokeStyle = '#b89a72'; ctx.lineWidth = 1.2; [-14, 0, 14].forEach(dx => { ctx.beginPath(); ctx.moveTo(x + sw * .3, 0); ctx.lineTo(x + dx + sw, y); ctx.stroke(); });
  const g = ctx.createLinearGradient(x - 20, 0, x + 20, 0); g.addColorStop(0, '#e9e1d2'); g.addColorStop(1, '#c9bba3'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 22 + sw, y); ctx.lineTo(x + 22 + sw, y); ctx.lineTo(x + 16 + sw, y + 26); ctx.lineTo(x - 16 + sw, y + 26); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 9; i++) leaf(x + sw + (i - 4) * 5, y + 2, .9, (i - 4) * .35, ['#3f8f3c', '#57a84a', '#6cb85a'][i % 3]); }
function drawBg(t) {
  const wall = ctx.createLinearGradient(0, 0, 0, 760); wall.addColorStop(0, '#fbf6ec'); wall.addColorStop(1, '#efe4d2'); ctx.fillStyle = wall; ctx.fillRect(0, 0, W, 760);
  // cửa kính lớn, trời sáng, cây xanh ngoài vườn
  const wx = 96, wy = 96, ww = 348, wh = 470; ctx.fillStyle = '#d8c7a6'; rr(wx - 10, wy - 10, ww + 20, wh + 20, 6); ctx.fill();
  const sky = ctx.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, '#e4f3ff'); sky.addColorStop(.7, '#fffaf0'); sky.addColorStop(1, '#f3f7e6'); ctx.fillStyle = sky; ctx.fillRect(wx, wy, ww, wh);
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip(); ctx.globalAlpha = .55; [[120, 470, 70], [210, 500, 90], [330, 480, 80], [420, 505, 70], [160, 540, 60], [380, 545, 75]].forEach(([x, y, r], i) => { ctx.fillStyle = ['#a9d39a', '#8cc47e', '#b7dca8'][i % 3]; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = .9; const sun = ctx.createRadialGradient(400, 130, 5, 400, 130, 150); sun.addColorStop(0, 'rgba(255,250,220,1)'); sun.addColorStop(1, 'rgba(255,250,220,0)'); ctx.fillStyle = sun; ctx.fillRect(wx, wy, ww, wh); ctx.restore();
  ctx.fillStyle = '#e9dcc2'; ctx.fillRect(wx + ww / 2 - 4, wy, 8, wh); [1, 2].forEach(k => ctx.fillRect(wx, wy + wh * k / 3 - 3, ww, 6));
  // tia nắng chéo vào phòng
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; [0, 1, 2].forEach(i => { ctx.globalAlpha = .07 + .03 * Math.sin(t * .6 + i * 2); ctx.fillStyle = '#fff3cf'; ctx.beginPath(); const x0 = 300 + i * 60; ctx.moveTo(x0, 96); ctx.lineTo(x0 + 50, 96); ctx.lineTo(x0 - 210, 960); ctx.lineTo(x0 - 300, 960); ctx.closePath(); ctx.fill(); }); ctx.restore();
  // sàn gỗ sáng
  const fl = ctx.createLinearGradient(0, 760, 0, H); fl.addColorStop(0, '#d9b48a'); fl.addColorStop(1, '#b98d62'); ctx.fillStyle = fl; ctx.fillRect(0, 760, W, H - 760); ctx.strokeStyle = 'rgba(120,80,40,.25)'; ctx.lineWidth = 1; for (let y = 790; y < H; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.fillStyle = '#e7dccb'; ctx.fillRect(0, 752, W, 10);
  // kệ sách nhỏ bên phải + cây trầu bà to góc trái dưới
  ctx.fillStyle = '#b88a5a'; ctx.fillRect(452, 330, 88, 6); [['#5b7fa6', 12], ['#c96b4a', 9], ['#e3c27a', 11], ['#6a9a6a', 8]].forEach(([c, w], i) => { ctx.fillStyle = c; ctx.fillRect(458 + i * 14, 330 - 30 - (i % 2) * 4, w, 30 + (i % 2) * 4); });
  ctx.fillStyle = '#d9cbb4'; ctx.beginPath(); ctx.moveTo(14, 700); ctx.lineTo(66, 700); ctx.lineTo(58, 760); ctx.lineTo(22, 760); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + (i - 4) * .28 + Math.sin(t * .7 + i) * .03; ctx.strokeStyle = '#4a7a2e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, 702); const ex = 40 + Math.cos(a) * 110, ey = 702 + Math.sin(a) * 110; ctx.quadraticCurveTo(40 + Math.cos(a) * 50, 702 + Math.sin(a) * 70, ex, ey); ctx.stroke(); leaf(ex, ey, 2.2, a + Math.PI / 2, ['#3f8f3c', '#57a84a', '#2f7330'][i % 3]); }
  // chậu treo + dây trầu bà rủ xuống
  hangPot(64, 150, t, 0); hangPot(478, 132, t, 1.3); VINES.forEach((v, i) => drawVine(v, t, i * .7));
}
function sleeve(x0, y0, x1, y1, w) { ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#3c2214'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2 + (x1 > x0 ? -6 : 6), (y0 + y1) / 2 + 14, x1, y1); ctx.stroke();
  ctx.strokeStyle = 'rgba(217,168,69,.8)'; ctx.lineWidth = 2.2; ctx.beginPath(); const ex = x1 + (x0 - x1) * .06, ey = y1 + (y0 - y1) * .06; ctx.arc(ex, ey, w / 2 - 1, 0, 7); ctx.stroke(); ctx.restore(); }
function hand(x, y, a, open) { ctx.save(); ctx.translate(x, y); ctx.rotate(a || 0); ctx.fillStyle = '#e2b48c'; ctx.strokeStyle = '#a8764f'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.ellipse(0, 0, 10, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-6 + i * 4, open ? -10 : -6, 2, open ? 5.5 : 3.5, 0, 0, 7); ctx.fill(); ctx.stroke(); } ctx.beginPath(); ctx.ellipse(9, -2, 2.4, 4.5, -.6, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
function drawThay(t) {
  const c = S.cur, ph = c ? c.phase : 'idle', breathe = Math.sin(t * 1.6) * 1.2, hy = HY + breathe * .4;
  // thân áo the
  ctx.save(); const bg = ctx.createLinearGradient(0, hy + 10, 0, DESK); bg.addColorStop(0, '#5b3320'); bg.addColorStop(1, '#2c170c'); ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(HX - 24, hy + 34); ctx.quadraticCurveTo(HX - 70, hy + 42, HX - 86, hy + 74 + breathe); ctx.lineTo(HX - 106, DESK + 4); ctx.lineTo(HX + 106, DESK + 4); ctx.lineTo(HX + 86, hy + 74 + breathe); ctx.quadraticCurveTo(HX + 70, hy + 42, HX + 24, hy + 34); ctx.closePath(); ctx.fill();
  // hoa văn chìm
  ctx.globalAlpha = .12; ctx.strokeStyle = '#e6b552'; ctx.lineWidth = 1; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(HX - 60 + (i % 3) * 60, hy + 90 + Math.floor(i / 3) * 50, 9, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;
  // cổ giao lĩnh: lót trắng + viền vàng
  ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.moveTo(HX - 20, hy + 34); ctx.lineTo(HX, hy + 78); ctx.lineTo(HX + 20, hy + 34); ctx.lineTo(HX + 12, hy + 34); ctx.lineTo(HX, hy + 60); ctx.lineTo(HX - 12, hy + 34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d9a845'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(HX - 23, hy + 33); ctx.lineTo(HX + 2, hy + 84); ctx.lineTo(HX + 2, DESK); ctx.stroke(); ctx.beginPath(); ctx.moveTo(HX + 23, hy + 33); ctx.lineTo(HX + 2, hy + 84); ctx.stroke(); ctx.restore();
  // cổ + đầu (phóng 1,28 lần quanh cằm cho cân người)
  ctx.fillStyle = '#d9a982'; ctx.fillRect(HX - 12, hy + 22, 24, 16);

    text('⏰ ' + (A.goiTitle || 'Giờ đẹp kế tiếp'), W / 2, sy + 8, 14, '#f6dc96', { f: SERIF, w: 800 });
    const cw = (w - 28 - 20) / 3; gy.forEach((g, i) => { const p = g.nhan.split(' '), l1 = p[0], l2 = p.slice(1).join(' '), cx0 = x + 14 + i * (cw + 10); ctx.font = `700 13px ${UI}`; const f2 = Math.min(13, 13 * (cw - 10) / Math.max(1, ctx.measureText(l2).width));
      ctx.fillStyle = 'rgba(20,90,45,.85)'; rr(cx0, sy + 20, cw, 48, 10); ctx.fill(); ctx.strokeStyle = '#9df0b4'; ctx.lineWidth = 1.5; ctx.stroke();
      text(l1, cx0 + cw / 2, sy + 35, 16, '#eaffef', { w: 800 }); text(l2, cx0 + cw / 2, sy + 55, f2, '#c9f5d4', { w: 700 }); }); ctx.restore(); }
  ctx.restore(); }
let last = performance.now();
function frame(now) { requestAnimationFrame(frame); const dt = clamp((now - last) / 1000, 0, .05); last = now;
  try { update(dt); sim(dt); const t = S.t; drawBg(t);
    ctx.save(); ctx.translate(HX, BASE_Y); ctx.scale(SC, SC); ctx.translate(-HX, -DESK); drawThay(t); drawDesk(t); drawCoins(); drawSparks(); ctx.restore();
    drawNoi(); drawPhan(t);
  } catch (e) { console.error(e); } }

// ---------- Sự kiện người xem ----------
function onComment(name, msg, that) { const r = L.docHaiTuoi(msg, S.day.yy), tuoi = r.tuoi, sep = r.sep, ngay = L.hoiNgay(msg, S.day); if (tuoi) S.nho.set(name, tuoi); if (sep) S.nhoSep.set(name, sep);
  if (ngay) return enqueue({ ten: name, tuoi: tuoi || S.nho.get(name) || null, sep: sep || S.nhoSep.get(name) || null, ngay, that });
  if (tuoi || sep) return enqueue({ ten: name, tuoi: tuoi || S.nho.get(name) || null, sep: sep || S.nhoSep.get(name) || null, that });
  if (/tr[iì]nh k[yý]|gi[oờ] t[oố]t|xem gi[uú]p|th[aầ]y [oơ]i xem/i.test(String(msg))) enqueue({ ten: name, tuoi: null, that }); }
function onLike(name, n, that) { const v = (S.likes.get(name) || 0) + n; S.likes.set(name, v);
  if (v >= 10) { S.likes.set(name, 0); const lx = S.lastXem.get(name) || -999; if (S.t - lx > 120) { S.lastXem.set(name, S.t); enqueue({ ten: name, tuoi: null, that }); } } }
function onShare(name) { if (!S.cur) noi('Cảm ơn ' + ten(name) + ' đã chia sẻ, chúc ký đâu trúng đó!', 4); }
function onFollow(name) { if (!S.cur) noi('Chào ' + ten(name) + '!', 3); }
function onGift(name) { if (!S.cur) noi('Không nhận quà, ' + ten(name) + ' thả tim là được rồi.', 4); }

// ---------- Giả lập người xem (tắt bằng ?sim=0) ----------
const SIM_ON = Q.get('sim') !== '0';
const NAMES = ['Mơ Dung', 'Thu Hà', 'Quang Huy', 'Kim Oanh', 'Tuấn Đạt', 'Bảo Ngọc', 'Hải Đăng', 'Minh Khôi', 'Lan Hương', 'Văn Tú', 'Diệu Linh', 'Phúc Lộc', 'Trà My', 'Hồng Nhung', 'Đức Minh', 'Ngọc Ánh'];
const SIM_MSG = ['Em 1999, mai có nên trình sếp không, sếp sinh năm 85', 'thứ 5 trình được không ạ', 'em 1991, 20/11 thì sao', 'chiều mai được không thầy', 'em 1991 sếp 1975', 'sếp tuổi Thìn, em 1990', 'sếp 1984 ạ', 'em 1995 sếp 1977', 'con sinh 1991', 'em 1995 thầy ơi', '1988', 'con tuổi Hợi', 'thầy xem giúp con trình ký', '96 ạ', 'Canh Ngọ', 'tuổi Dần ạ', '1983'];
let simT = 3;
function sim(dt) { if (!SIM_ON) return; simT -= dt; if (simT > 0) return; simT = S.real ? rnd(10, 16) : rnd(3, 6); const nm = pick(NAMES);
  if (Math.random() < .5) onLike(nm, Math.floor(rnd(3, 7)), false); else onComment(nm, pick(SIM_MSG), false); }

// ---------- Kết nối live: EulerStream (điện thoại) + TikFinity (máy tính) ----------
const nameOf = (o) => { const u = (o && (o.user || o.fromUser || (o.common && o.common.user))) || null; if (u) return u.nickname || u.uniqueId || u.displayId || null; if (o && (o.nickname || o.uniqueId)) return o.nickname || o.uniqueId; return null; };
function handle(type, d) { const name = nameOf(d); if (!name) return; const nm = String(name).slice(0, 24), t = String(type || '').toLowerCase();
  if (t.includes('chat')) { const c = d.comment || d.content || ''; if (c) onComment(nm, c, true); }
  else if (t.includes('like')) onLike(nm, Math.max(1, Math.min(50, +(d.count || d.likeCount || 1))), true);
  else if (t.includes('gift')) { if (!d.repeatEnd && d.repeatEnd !== undefined && d.giftType === 1) return; onGift(nm); }
  else if (t.includes('social')) { const a = JSON.stringify(d.common && d.common.displayText || d.action || d.displayType || '').toLowerCase(); if (a.includes('share') || +d.action === 3) onShare(nm); else onFollow(nm); }
  else if (t === 'share') onShare(nm); else if (t === 'follow') onFollow(nm); }
const LS = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let ws = null, retry = 0;
function eulerConnect() { const u = LS.get('hd_live_user').replace(/^@/, '').trim(), k = LS.get('hd_live_key').trim(); if (!u || !k) return;
  try { ws = new WebSocket('wss://ws.eulerstream.com?uniqueId=' + encodeURIComponent(u) + '&apiKey=' + encodeURIComponent(k) + '&features.bundleEvents=true'); } catch (e) { setTimeout(eulerConnect, 10000); return; }
  ws.onopen = () => { retry = 0; S.real = true; };
  ws.onmessage = (ev) => { let j; try { j = JSON.parse(ev.data); } catch (e) { return; } (Array.isArray(j.messages) ? j.messages : [j]).forEach(m => { const type = m.type || m.event || m.name; let d = m.data || null; if (!d && m.json) { try { d = JSON.parse(m.json); } catch (e) {} } if (type) handle(type, d || m); }); };
  ws.onclose = (e) => { S.real = false; ws = null; if (e.code === 4401 || e.code === 4403) return; retry++; setTimeout(eulerConnect, Math.min(30, 5 * retry) * 1000); }; ws.onerror = () => {}; }
function tfConnect() { let tf; try { tf = new WebSocket('ws://localhost:21213/'); } catch (e) { return; }
  tf.onopen = () => { S.real = true; }; tf.onmessage = (ev) => { let j; try { j = JSON.parse(ev.data); } catch (e) { return; } const type = j.event || j.type; if (type) handle(type, j.data || {}); };
  tf.onclose = () => { setTimeout(tfConnect, 8000); }; tf.onerror = () => {}; }

// ---------- Màn hình chờ ----------
const st = document.getElementById('start'), iu = document.getElementById('u'), ik = document.getElementById('k'), cfg = document.getElementById('cfg'), res = document.getElementById('res'), vo = document.getElementById('voice');
iu.value = LS.get('hd_live_user'); ik.value = LS.get('hd_live_key'); vo.checked = LS.get('tk_voice') !== '0';
document.getElementById('tog').addEventListener('click', () => { cfg.hidden = !cfg.hidden; });
document.getElementById('test').addEventListener('click', () => { const u = iu.value.trim().replace(/^@/, ''), k = ik.value.trim(); if (!u || !k) { res.textContent = 'Anh nhập tên kênh và API key trước nhé.'; return; }
  LS.set('hd_live_user', iu.value.trim()); LS.set('hd_live_key', k); res.textContent = 'Đang kiểm tra…'; let t;
  try { t = new WebSocket('wss://ws.eulerstream.com?uniqueId=' + encodeURIComponent(u) + '&apiKey=' + encodeURIComponent(k)); } catch (e) { res.textContent = 'Không mở được kết nối.'; return; }
  const done = m => { res.textContent = m; try { t.onclose = null; t.close(); } catch (e) {} };
  t.onopen = () => done('✅ Key đúng, kênh @' + u + ' đang live, sẵn sàng.');
  t.onclose = (e) => { res.textContent = ({ 4401: '❌ API key không đúng.', 4403: '❌ Gói Euler không cho phép.', 4404: '✅ Key đúng. Kênh @' + u + ' chưa live, lên live là tự kết nối.', 4429: '⚠️ Quá số kết nối của gói, thử lại sau.' })[e.code] || ('⚠️ Chưa rõ (mã ' + e.code + ').'); };
  setTimeout(() => { if (res.textContent === 'Đang kiểm tra…') done('⚠️ Không có phản hồi, kiểm tra mạng.'); }, 15000); });
document.getElementById('go').addEventListener('click', () => {
  LS.set('hd_live_user', iu.value.trim()); LS.set('hd_live_key', ik.value.trim()); S.voice = vo.checked; LS.set('tk_voice', vo.checked ? '1' : '0');
  st.remove(); S.sound = true; acGet(); sGong();
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); }); } catch (e) {}
  try { const de = document.documentElement; (de.requestFullscreen || de.webkitRequestFullscreen || (() => {})).call(de); } catch (e) {}
  eulerConnect(); tfConnect(); setTimeout(() => noi('Sắp trình ký? Thả 10 tim để xem.', 6), 800);
});
if (Q.get('auto') === '1') document.getElementById('go').click();
// tự cập nhật khi có bản mới (chỉ ở chế độ ?auto=1 trên máy tính, vì tải lại tự vào phòng và bật nhạc được): đọc ver.txt mỗi phút, đổi thì tải lại lúc rảnh
if (Q.get('auto') === '1') { let ver0 = null, cho = false;
  const chk = () => fetch('ver.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(v => { if (!v) return; v = v.trim(); if (ver0 === null) ver0 = v; else if (v !== ver0) cho = true; }).catch(() => {});
  chk(); setInterval(chk, 60000); setInterval(() => { if (cho && !S.cur && !S.queue.length) location.reload(); }, 2000); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
window.__tk = { S, onComment, onLike, enqueue };
})();
