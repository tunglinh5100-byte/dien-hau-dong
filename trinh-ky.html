  <label><input id="voice" type="checkbox" checked style="width:auto"> Giọng thầy đọc lời giải</label>

  </div>
</div>
<script src="lich.js"></script>
<script>
(() => {
'use strict';

setInterval(() => { if (Math.random() < .6) ambient(); }, 1700);

let VOICE = null;

  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s); u.lang = 'vi-VN'; if (VOICE) u.voice = VOICE; u.rate = 1.0; u.pitch = .72; u.volume = 1;
    S.speaking = true; u.onend = u.onerror = () => { S.speaking = false; if (then) then(); }; speechSynthesis.speak(u); return 1; } catch (e) { return 0; } }

// ---------- Việc của thầy: mỗi việc { ten, tuoi | null, that } ----------
function enqueue(job) { if (S.queue.some(j => j.ten === job.ten) || (S.cur && S.cur.job.ten === job.ten)) return;

  if (S.queue.length > 10) S.queue.splice(10); }

  S.coins = faces.map((f, i) => ({ x0: HX + rnd(-8, 8), y0: HY + 130, x1: HX - 46 + i * 46 + rnd(-8, 8), y1: DESK + 6 + rnd(-3, 3), t: -i * .06, dur: .62, face: f, rot: rnd(8, 14) })); setTimeout(sCoin, 560); }

  if (S.noi) { S.noi.t += dt; if (S.noi.t > S.noi.life) S.noi = null; }
  const c = S.cur;
  if (!c) { S.idleT -= dt; if (S.idleT <= 0 && S.queue.length) startJob(S.queue.shift()); else if (S.idleT < -6 && !S.noi) { S.idleT = 0; noi(IDLE[S.idleI++ % IDLE.length], 5); } return; }
  c.t += dt;
  if (c.phase === 'goi' && c.t > 1.2) { c.phase = 'gieo'; c.t = 0; throwCoins(); }
  else if (c.phase === 'gieo' && c.t > 1.15) { c.tossI++; c.t = 0; if (c.tossI >= 3) { c.phase = 'suy'; noi('Hừm… để thầy bấm độn…', 99); } else throwCoins(); }
  else if (c.phase === 'suy' && c.t > 2.4) { c.phase = 'phan'; c.t = 0; S.noi = null; sGong(); burst(); say(c.ans.speak, () => { c.spoke = true; }); }
  else if (c.phase === 'phan' && c.t > 10 && (c.spoke || c.t > 20)) { c.phase = 'xong'; c.t = 0; }
  else if (c.phase === 'xong' && c.t > .5) { S.cur = null; S.coins = []; S.idleT = 1.5; }
}
function burst() { for (let i = 0; i < 26; i++) { const a = rnd(0, 6.28), v = rnd(30, 110); S.sparks.push({ x: HX, y: HY - 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: rnd(1, 1.8), c: pick(['#ffe39a', '#f6c453', '#fff6d6']) }); } }

// ---------- Vẽ: nền điện, thầy, lời thầy ----------
const HX = 270, HY = 352, DESK = 528, SC = 1.3, BASE_Y = 842; // thầy vẽ ở toạ độ gốc rồi phóng SC, đặt mép bàn ở BASE_Y
function drawBg() { ctx.fillStyle = '#1a0c06'; ctx.fillRect(0, 0, W, H);
  if (BG.complete && BG.naturalWidth) { const s = H / BG.naturalHeight, w = BG.naturalWidth * s; ctx.drawImage(BG, (W - w) / 2, 0, w, H); }
  const g = ctx.createLinearGradient(0, 520, 0, H); g.addColorStop(0, 'rgba(10,4,2,0)'); g.addColorStop(1, 'rgba(10,4,2,.55)'); ctx.fillStyle = g; ctx.fillRect(0, 520, W, H - 520); }

function drawThay(t) {
  const c = S.cur, ph = c ? c.phase : 'idle', breathe = Math.sin(t * 1.6) * 1.2, hy = HY + breathe * .4;
  // thân áo the
  ctx.save(); const bg = ctx.createLinearGradient(0, hy + 10, 0, DESK); bg.addColorStop(0, '#5b3320'); bg.addColorStop(1, '#2c170c'); ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(HX - 24, hy + 34); ctx.quadraticCurveTo(HX - 70, hy + 42, HX - 86, hy + 74 + breathe); ctx.lineTo(HX - 106, DESK + 4); ctx.lineTo(HX + 106, DESK + 4); ctx.lineTo(HX + 86, hy + 74 + breathe); ctx.quadraticCurveTo(HX + 70, hy + 42, HX + 24, hy + 34); ctx.closePath(); ctx.fill();
  // hoa văn chìm
  ctx.globalAlpha = .12; ctx.strokeStyle = '#e6b552'; ctx.lineWidth = 1; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(HX - 60 + (i % 3) * 60, hy + 90 + Math.floor(i / 3) * 50, 9, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;
  // cổ giao lĩnh: lót trắng + viền vàng
  ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.moveTo(HX - 20, hy + 34); ctx.lineTo(HX, hy + 78); ctx.lineTo(HX + 20, hy + 34); ctx.lineTo(HX + 12, hy + 34); ctx.lineTo(HX, hy + 60); ctx.lineTo(HX - 12, hy + 34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d9a845'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(HX - 23, hy + 33); ctx.lineTo(HX + 2, hy + 84); ctx.lineTo(HX + 2, DESK); ctx.stroke(); ctx.beginPath(); ctx.moveTo(HX + 23, hy + 33); ctx.lineTo(HX + 2, hy + 84); ctx.stroke(); ctx.restore();
  // cổ + đầu (phóng 1,28 lần quanh cằm cho cân người)
  ctx.fillStyle = '#d9a982'; ctx.fillRect(HX - 12, hy + 22, 24, 16);
  ctx.save(); ctx.translate(HX, hy + 30); ctx.scale(1.28, 1.28); ctx.translate(-HX, -(hy + 30));
  ctx.fillStyle = '#d9a982'; ctx.beginPath(); ctx.ellipse(HX - 30, hy + 2, 6, 10, 0, 0, 7); ctx.ellipse(HX + 30, hy + 2, 6, 10, 0, 0, 7); ctx.fill();
  const fg = ctx.createRadialGradient(HX - 8, hy - 8, 6, HX, hy, 42); fg.addColorStop(0, '#f1c9a2'); fg.addColorStop(1, '#cf9c76'); ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(HX, hy, 29, 36, 0, 0, 7); ctx.fill();
  // nếp nhăn trán
  ctx.strokeStyle = 'rgba(140,90,60,.45)'; ctx.lineWidth = 1; [-18, -13].forEach(dy => { ctx.beginPath(); ctx.moveTo(HX - 14, hy + dy); ctx.quadraticCurveTo(HX, hy + dy - 3, HX + 14, hy + dy); ctx.stroke(); });
  // khăn xếp
  ctx.save(); const kg = ctx.createLinearGradient(0, hy - 46, 0, hy - 18); kg.addColorStop(0, '#2a2a33'); kg.addColorStop(1, '#101016'); ctx.fillStyle = kg;
  ctx.beginPath(); ctx.ellipse(HX, hy - 28, 33, 15, 0, Math.PI, 0); ctx.lineTo(HX + 33, hy - 20); ctx.quadraticCurveTo(HX, hy - 12, HX - 33, hy - 20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(160,160,180,.35)'; ctx.lineWidth = 1; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(HX, hy - 22 - i * 4, 33 - i * 2, 7, 0, .1, Math.PI - .1); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(HX - 16, hy - 40); ctx.lineTo(HX + 16, hy - 24); ctx.moveTo(HX + 16, hy - 40); ctx.lineTo(HX - 16, hy - 24); ctx.strokeStyle = 'rgba(160,160,180,.25)'; ctx.stroke(); ctx.restore();
  // lông mày bạc
  ctx.strokeStyle = '#f4f1ea'; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; const browUp = ph === 'phan' ? -1.5 : ph === 'suy' ? 1.2 : 0;
  ctx.beginPath(); ctx.moveTo(HX - 21, hy - 6 + browUp); ctx.quadraticCurveTo(HX - 13, hy - 11 + browUp, HX - 5, hy - 7 + browUp); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(HX + 21, hy - 6 + browUp); ctx.quadraticCurveTo(HX + 13, hy - 11 + browUp, HX + 5, hy - 7 + browUp); ctx.stroke();

  ctx.strokeStyle = '#3a2416'; ctx.fillStyle = '#2a1a10'; ctx.lineWidth = 1.6;
  [-12, 12].forEach(dx => { if (closed) { ctx.beginPath(); ctx.moveTo(HX + dx - 5, hy + 1); ctx.quadraticCurveTo(HX + dx, hy + 4, HX + dx + 5, hy + 1); ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(HX + dx, hy + 1, 3, 2.6, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(HX + dx + 1, hy, .8, 0, 7); ctx.fill(); ctx.fillStyle = '#2a1a10'; } });
  // kính tròn gọng vàng
  ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(HX - 12, hy + 1, 8.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(HX + 12, hy + 1, 8.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(HX - 3.5, hy); ctx.quadraticCurveTo(HX, hy - 2, HX + 3.5, hy); ctx.stroke();
  ctx.globalAlpha = .18; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(HX - 15, hy - 3, 3, 2, -.5, 0, 7); ctx.ellipse(HX + 9, hy - 3, 3, 2, -.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  // mũi
  ctx.strokeStyle = 'rgba(150,95,60,.8)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(HX, hy + 4); ctx.quadraticCurveTo(HX + 4, hy + 13, HX - 1, hy + 15); ctx.stroke();
  // râu dài bạc (đung đưa nhẹ)
  const sway = Math.sin(t * 1.3) * 2.5 + (ph === 'phan' ? Math.sin(t * 9) * .8 : 0);
  ctx.save(); const bd = ctx.createLinearGradient(0, hy + 14, 0, hy + 120); bd.addColorStop(0, '#fbfaf6'); bd.addColorStop(1, '#d8d4cb'); ctx.fillStyle = bd;
  ctx.beginPath(); ctx.moveTo(HX - 22, hy + 14); ctx.quadraticCurveTo(HX - 24, hy + 52, HX - 8 + sway * .5, hy + 92); ctx.quadraticCurveTo(HX + sway, hy + 128, HX + 3 + sway, hy + 126); ctx.quadraticCurveTo(HX + 10 + sway * .6, hy + 92, HX + 22, hy + 14); ctx.quadraticCurveTo(HX, hy + 34, HX - 22, hy + 14); ctx.fill();
  ctx.strokeStyle = 'rgba(160,150,140,.45)'; ctx.lineWidth = .8; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(HX + i * 5, hy + 30); ctx.quadraticCurveTo(HX + i * 3 + sway * .5, hy + 70, HX + i * 1.2 + sway, hy + 110); ctx.stroke(); } ctx.restore();
  // miệng (mở khi nói) + ria
  const talk = ph === 'phan' && (S.speaking || c.t < 3) ? Math.abs(Math.sin(t * 11)) * 3.2 : 0;
  ctx.fillStyle = '#5a2418'; ctx.beginPath(); ctx.ellipse(HX, hy + 22, 5, .8 + talk, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f7f5ef'; ctx.beginPath(); ctx.moveTo(HX, hy + 16); ctx.quadraticCurveTo(HX - 14, hy + 15, HX - 25, hy + 34 + sway * .3); ctx.quadraticCurveTo(HX - 15, hy + 22, HX, hy + 20); ctx.quadraticCurveTo(HX + 15, hy + 22, HX + 25, hy + 34 + sway * .3); ctx.quadraticCurveTo(HX + 14, hy + 15, HX, hy + 16); ctx.fill();
  ctx.restore();
  // tay theo trạng thái
  const shL = [HX - 74, hy + 62], shR = [HX + 74, hy + 62];
  if (ph === 'gieo' || ph === 'goi') { const k = ph === 'goi' ? 0 : c.t, shake = ph === 'gieo' && k < .35 ? Math.sin(t * 40) * 4 : 0, lift = ph === 'gieo' ? (k < .35 ? -6 : k < .5 ? -18 : -4) : 0;
    sleeve(...shL, HX - 16, hy + 132 + lift + shake, 30); sleeve(...shR, HX + 16, hy + 132 + lift - shake, 30); hand(HX - 12, hy + 126 + lift + shake, .5); hand(HX + 12, hy + 126 + lift - shake, -.5); }
  else if (ph === 'phan') { const wv = Math.sin(t * 2.2) * 4; sleeve(...shR, HX + 118, hy + 70 + wv, 28); hand(HX + 120, hy + 62 + wv, -.3, true); sleeve(...shL, HX - 70, DESK - 12, 30); hand(HX - 66, DESK - 16, .2); }
  else { const st = Math.sin(t * (ph === 'suy' ? 1.8 : .9)) * 14; sleeve(...shL, HX - 14, hy + 70 + st, 28); hand(HX - 10, hy + 64 + st, .9); sleeve(...shR, HX + 72, DESK - 12, 30); hand(HX + 68, DESK - 16, -.2); }
}
