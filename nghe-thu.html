<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nghe thử câu chào</title>
<body style="font-family:system-ui,sans-serif;background:#3a140d;color:#f6e6c8;margin:0;padding:28px 20px;text-align:center">
<h2 style="font-weight:600;margin:0 0 18px">Nghe thử câu chào người mới vào live</h2>
<input id="ten" value="Hoa Mai" style="width:100%;max-width:360px;font-size:20px;padding:12px;border-radius:10px;border:0;box-sizing:border-box">
<p id="cau" style="font-size:17px;margin:16px 0"></p>
<button id="phat" style="font-size:22px;padding:16px 34px;border-radius:14px;border:0;background:#e9b43a;color:#3a140d;font-weight:700">▶️ Nghe (tốc độ 1,5)</button>
<p style="margin-top:18px"><button id="cham" style="font-size:16px;padding:10px 18px;border-radius:10px;border:0">Nghe tốc độ thường</button></p>
<p id="tb" style="opacity:.8;font-size:14px"></p>
<script>
const $=i=>document.getElementById(i);const cau=()=>$('ten').value.trim()+' ơi, để vào chiếu ngồi, bạn chia sẻ live nhé.';
const hien=()=>$('cau').textContent='“'+cau()+'”';$('ten').oninput=hien;hien();
function phat(r){const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q='+encodeURIComponent(cau()));a.playbackRate=r;a.preservesPitch=true;a.onplaying=()=>{a.playbackRate=r};$('tb').textContent='Đang phát…';a.onended=()=>$('tb').textContent='';a.play().catch(()=>$('tb').textContent='Không phát được, anh thử bấm lại.');}
$('phat').onclick=()=>phat(1.5);$('cham').onclick=()=>phat(1);
</script></body></html>
